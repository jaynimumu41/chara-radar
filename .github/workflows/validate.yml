name: Validate Kawaii Radar

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install runtime dependency
        run: python -m pip install requests

      - name: Compile Python modules
        run: python -m compileall -q scraper

      - name: Run offline regression suite
        env:
          PYTHONIOENCODING: utf-8
        run: python scraper/smoke_test.py

      - name: Validate public data
        env:
          PYTHONIOENCODING: utf-8
        run: python scraper/data_lint.py

      - name: Block high-confidence duplicate pairs
        env:
          PYTHONIOENCODING: utf-8
        run: python scraper/audit_similar_events.py --fail-on-review
