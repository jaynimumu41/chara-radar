<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Kawaii Radar｜角色活動情報</title>

  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Kawaii Radar" />

  <link rel="stylesheet" href="css/app.css?v=20261025-health" />
</head>
<body>
  <!-- Lucide-derived icon sprite, kept local so the dashboard works offline. -->
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path>
    </symbol>
    <symbol id="icon-calendar" viewBox="0 0 24 24">
      <path d="M8 2v4M16 2v4"></path><rect width="18" height="18" x="3" y="4" rx="2"></rect><path d="M3 10h18"></path>
    </symbol>
    <symbol id="icon-map-pin" viewBox="0 0 24 24">
      <path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"></path><circle cx="12" cy="10" r="2.5"></circle>
    </symbol>
    <symbol id="icon-building" viewBox="0 0 24 24">
      <path d="M6 22V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v18M6 12H4a1 1 0 0 0-1 1v9h18v-9a1 1 0 0 0-1-1h-2M10 7h4M10 11h4M10 15h4M10 19h4"></path>
    </symbol>
    <symbol id="icon-sparkles" viewBox="0 0 24 24">
      <path d="m12 3-1.5 3.8A3 3 0 0 1 8.8 8.5L5 10l3.8 1.5a3 3 0 0 1 1.7 1.7L12 17l1.5-3.8a3 3 0 0 1 1.7-1.7L19 10l-3.8-1.5a3 3 0 0 1-1.7-1.7L12 3ZM5 3v4M3 5h4M19 17v4M17 19h4"></path>
    </symbol>
    <symbol id="icon-external-link" viewBox="0 0 24 24">
      <path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
    </symbol>
    <symbol id="icon-chevron-down" viewBox="0 0 24 24">
      <path d="m6 9 6 6 6-6"></path>
    </symbol>
    <symbol id="icon-x" viewBox="0 0 24 24">
      <path d="M18 6 6 18M6 6l12 12"></path>
    </symbol>
    <symbol id="icon-rotate-ccw" viewBox="0 0 24 24">
      <path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path>
    </symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>
    </symbol>
    <symbol id="icon-filter" viewBox="0 0 24 24">
      <path d="M4 6h16M7 12h10M10 18h4"></path>
    </symbol>
    <symbol id="icon-alert-triangle" viewBox="0 0 24 24">
      <path d="M21.7 18 13.7 4a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"></path>
      <path d="M12 9v4M12 17h.01"></path>
    </symbol>
  </svg>

  <header class="app-header">
    <div class="header-inner">
      <a class="app-brand" href="#" aria-label="Kawaii Radar 首頁">
        <img class="app-mark" src="icon-192.png" alt="" width="40" height="40" />
        <span class="brand-copy">
          <strong>Kawaii Radar</strong>
          <span>角色活動情報</span>
        </span>
      </a>
      <div class="sync-status" aria-live="polite">
        <span class="sync-dot" aria-hidden="true"></span>
        <span id="last-updated">資料同步中</span>
      </div>
    </div>
  </header>

  <div class="system-health-alert" id="system-health-alert" role="status" hidden>
    <div class="system-health-inner">
      <svg class="ui-icon" aria-hidden="true"><use href="#icon-alert-triangle"></use></svg>
      <span id="system-health-message"></span>
    </div>
  </div>

  <main class="app-shell">
    <section class="page-intro" aria-labelledby="page-title">
      <div class="page-intro-copy">
        <img class="intro-mark" src="icon-192.png" alt="" width="64" height="64" />
        <div class="intro-copy-inner">
          <span class="scope-label">JAPAN / TAIWAN</span>
          <div class="page-title-line">
            <h1 id="page-title">活動情報</h1>
            <span class="title-sparkle" aria-hidden="true">
              <svg class="ui-icon"><use href="#icon-sparkles"></use></svg>
            </span>
          </div>
          <p id="page-description">Pokémon、Miffy、Chiikawa 的期間限定活動與實體情報</p>
        </div>
      </div>
      <div class="view-tabs" role="group" aria-label="情報檢視">
        <button class="view-tab active" type="button" aria-pressed="true" data-view="events">
          <svg class="ui-icon" aria-hidden="true"><use href="#icon-calendar"></use></svg>
          <span>活動情報</span>
        </button>
        <button class="view-tab" type="button" aria-pressed="false" data-view="stores">
          <svg class="ui-icon" aria-hidden="true"><use href="#icon-building"></use></svg>
          <span>常設店</span>
        </button>
      </div>
    </section>

    <section class="metrics-panel" aria-label="情報概況">
      <div class="metrics-heading">
        <strong>情報概況</strong>
        <span id="metrics-context">依目前篩選條件</span>
      </div>
      <div class="metrics-grid">
        <button class="metric metric-primary" type="button" data-metric-index="0" aria-pressed="true" title="顯示全部情報">
          <span class="metric-value" id="stat-total">—</span>
          <span class="metric-label" id="stat-total-label">有效情報</span>
          <svg class="metric-filter-icon ui-icon" aria-hidden="true"><use href="#icon-filter"></use></svg>
        </button>
        <button class="metric metric-urgent" type="button" data-metric-index="1" aria-pressed="false" title="顯示 7 天內結束的情報">
          <span class="metric-value" id="stat-urgent">—</span>
          <span class="metric-label" id="stat-urgent-label">7 天內結束</span>
          <svg class="metric-filter-icon ui-icon" aria-hidden="true"><use href="#icon-filter"></use></svg>
        </button>
        <button class="metric metric-reservation" type="button" data-metric-index="2" aria-pressed="false" title="顯示需要預約的情報">
          <span class="metric-value" id="stat-reservation">—</span>
          <span class="metric-label" id="stat-reservation-label">需要預約</span>
          <svg class="metric-filter-icon ui-icon" aria-hidden="true"><use href="#icon-filter"></use></svg>
        </button>
        <button class="metric metric-limited" type="button" data-metric-index="3" aria-pressed="false" title="顯示有限定商品的情報">
          <span class="metric-value" id="stat-limited">—</span>
          <span class="metric-label" id="stat-limited-label">有限定商品</span>
          <svg class="metric-filter-icon ui-icon" aria-hidden="true"><use href="#icon-filter"></use></svg>
        </button>
      </div>
    </section>

    <section class="workspace" aria-label="情報清單">
      <div class="workspace-toolbar" id="workspace-toolbar">
        <div class="brand-filters" role="group" aria-label="品牌篩選">
          <button class="brand-pill active" type="button" data-brand="all" aria-pressed="true">
            <span class="brand-dot brand-dot-all" aria-hidden="true"></span>
            <span>全部</span>
            <span class="brand-filter-count" id="brand-count-all">—</span>
          </button>
          <button class="brand-pill" type="button" data-brand="pokemon" aria-pressed="false">
            <span class="brand-dot brand-dot-pokemon" aria-hidden="true"></span>
            <span>Pokémon</span>
            <span class="brand-filter-count" id="brand-count-pokemon">—</span>
          </button>
          <button class="brand-pill" type="button" data-brand="miffy" aria-pressed="false">
            <span class="brand-dot brand-dot-miffy" aria-hidden="true"></span>
            <span>Miffy</span>
            <span class="brand-filter-count" id="brand-count-miffy">—</span>
          </button>
          <button class="brand-pill" type="button" data-brand="chiikawa" aria-pressed="false">
            <span class="brand-dot brand-dot-chiikawa" aria-hidden="true"></span>
            <span>Chiikawa</span>
            <span class="brand-filter-count" id="brand-count-chiikawa">—</span>
          </button>
        </div>
      </div>

      <div class="results-head">
        <div class="results-copy">
          <strong id="events-count">載入中</strong>
          <button class="filter-toggle" id="filter-today" type="button" aria-pressed="false">
            <svg class="ui-icon" aria-hidden="true"><use href="#icon-sparkles"></use></svg>
            <span>今日新增</span>
            <span class="today-count" id="today-filter-count">0</span>
          </button>
          <span id="active-filter-summary"></span>
        </div>
      </div>

      <div class="today-summary" id="today-summary" hidden></div>
      <div class="events-grid" id="events-grid" aria-live="polite"></div>
      <div class="stores-wrap" id="stores-wrap" hidden></div>
    </section>
  </main>

  <script src="js/app.js?v=20261025-health"></script>
</body>
</html>
